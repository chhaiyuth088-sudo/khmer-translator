<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Khmer Translate</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
      color: #222;
    }

    .translator {
      background: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .languages {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 18px;
      resize: vertical;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      min-height: 100px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fafafa;
      font-size: 18px;
      white-space: pre-wrap;
    }

    .copy {
      margin-top: 10px;
      background: #333;
    }

    @media (max-width: 500px) {
      .languages {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 Khmer Translate</h1>

    <div class="translator">

      <div class="languages">

        <select id="from">
          <option value="km">🇰🇭 Khmer</option>
          <option value="en">🇬🇧 English</option>
        </select>

        <select id="to">
          <option value="en">🇬🇧 English</option>
          <option value="km">🇰🇭 Khmer</option>
        </select>

      </div>

      <textarea
        id="inputText"
        placeholder="Write something here..."
      ></textarea>

      <button onclick="translateText()">
        Translate
      </button>

      <div class="result" id="result">
        Translation will appear here...
      </div>

      <button class="copy" onclick="copyText()">
        📋 Copy Translation
      </button>

    </div>

  </div>

  <script>

    async function translateText() {

      const text = document.getElementById("inputText").value;
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const result = document.getElementById("result");

      if (!text.trim()) {
        result.innerText = "Please enter some text.";
        return;
      }

      result.innerText = "Translating...";

      /*
        VERSION 1

        This is the website interface.
        In the next step we will connect
        this function to a real Translation API.
      */

      if (from === "km" && to === "en") {

        result.innerText =
          "API connection will translate Khmer → English here.";

      } else if (from === "en" && to === "km") {

        result.innerText =
          "API connection will translate English → Khmer here.";

      } else {

        result.innerText = text;

      }
    }

    function copyText() {

      const text =
        document.getElementById("result").innerText;

      navigator.clipboard.writeText(text)
        .then(() => {
          alert("Translation copied!");
        })
        .catch(() => {
          alert("Could not copy the text.");
        });
    }

  </script>

</body>
</html>
