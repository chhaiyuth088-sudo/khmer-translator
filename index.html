<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Khmer Translate</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f2f5f9;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 20px 0;
      color: #222;
      font-size: 32px;
    }

    .translator {
      background: white;
      padding: 20px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .languages {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    select {
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      background: white;
    }

    .swap {
      width: auto;
      padding: 10px 15px;
      background: #555;
      margin-bottom: 15px;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 18px;
      resize: vertical;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #1877f2;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      min-height: 120px;
      border: 1px solid #ddd;
      border-radius: 12px;
      background: #fafafa;
      font-size: 18px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    .copy {
      margin-top: 10px;
      background: #333;
    }

    .speak {
      margin-top: 10px;
      background: #008000;
    }

    .status {
      text-align: center;
      margin-top: 12px;
      color: #555;
    }

    @media (max-width: 500px) {
      .languages {
        flex-direction: column;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>🌐 បកប្រែខ្មែរ</h1>

    <div class="translator">

      <div class="languages">

        <select id="from">
          <option value="km">🇰🇭 ភាសាខ្មែរ</option>
          <option value="en">🇬🇧 English</option>
        </select>

        <select id="to">
          <option value="en">🇬🇧 English</option>
          <option value="km">🇰🇭 ភាសាខ្មែរ</option>
        </select>

      </div>

      <button class="swap" onclick="swapLanguage()">
        🔄 ប្ដូរភាសា
      </button>

      <textarea
        id="inputText"
        placeholder="សរសេរអត្ថបទនៅទីនេះ..."
      ></textarea>

      <button onclick="translateText()">
        🔵 បកប្រែ
      </button>

      <div class="status" id="status"></div>

      <div class="result" id="result">
        លទ្ធផលបកប្រែនឹងបង្ហាញនៅទីនេះ...
      </div>

      <button class="copy" onclick="copyText()">
        📋 ចម្លងការបកប្រែ
      </button>

      <button class="speak" onclick="speakText()">
        🔊 អានសំឡេង
      </button>

    </div>

  </div>


  <script>

    async function translateText() {

      const text =
        document.getElementById("inputText").value.trim();

      const from =
        document.getElementById("from").value;

      const to =
        document.getElementById("to").value;

      const result =
        document.getElementById("result");

      const status =
        document.getElementById("status");


      if (!text) {
        result.innerText = "សូមបញ្ចូលអត្ថបទជាមុនសិន។";
        return;
      }


      if (from === to) {
        result.innerText = text;
        return;
      }


      result.innerText = "កំពុងបកប្រែ...";
      status.innerText = "⏳ សូមរង់ចាំ...";


      try {

        const url =
          "https://api.mymemory.translated.net/get?q=" +
          encodeURIComponent(text) +
          "&langpair=" +
          from + "|" + to;


        const response = await fetch(url);

        if (!response.ok) {
          throw new Error("API Error");
        }


        const data = await response.json();


        if (
          data.responseData &&
          data.responseData.translatedText
        ) {

          result.innerText =
            data.responseData.translatedText;

          status.innerText = "✅ បកប្រែរួចរាល់";

        } else {

          throw new Error("No translation");

        }


      } catch (error) {

        result.innerText =
          "❌ មិនអាចបកប្រែបានទេ។ សូមពិនិត្យ Internet ហើយសាកម្ដងទៀត។";

        status.innerText = "";

      }

    }


    function swapLanguage() {

      const from =
        document.getElementById("from");

      const to =
        document.getElementById("to");

      const oldFrom = from.value;

      from.value = to.value;
      to.value = oldFrom;


      const input =
        document.getElementById("inputText");

      const result =
        document.getElementById("result");


      if (result.innerText !==
          "លទ្ធផលបកប្រែនឹងបង្ហាញនៅទីនេះ...") {

        const oldResult = result.innerText;

        result.innerText = input.value;

        input.value = oldResult;

      }

    }


    function copyText() {

      const text =
        document.getElementById("result").innerText;


      navigator.clipboard.writeText(text)
        .then(() => {

          alert("✅ បានចម្លងការបកប្រែ!");

        })
        .catch(() => {

          alert("❌ មិនអាចចម្លងបានទេ។");

        });

    }


    function speakText() {

      const text =
        document.getElementById("result").innerText;

      const to =
        document.getElementById("to").value;


      if (!text.trim()) {
        return;
      }


      const speech =
        new SpeechSynthesisUtterance(text);


      speech.lang =
        to === "km" ? "km-KH" : "en-US";


      window.speechSynthesis.speak(speech);

    }

  </script>

</body>
</html>
